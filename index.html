<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OpenStarSense - Smartphone Telescope Guidance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .night-mode { background-color: #050000; color: #ff3333; }
        .night-mode .border-red { border-color: #990000; }
        .night-mode .bg-red-panel { background-color: rgba(40, 0, 0, 0.85); }
        body { touch-action: none; background: #000; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="night-mode h-screen w-screen flex flex-col justify-between select-none">

    <!-- Top Status Bar -->
    <header class="w-full bg-red-panel border-b border-red px-4 py-2 flex justify-between items-center z-20 text-xs">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-satellite-dish text-red-500 animate-pulse"></i>
            <span id="gps-status" class="font-mono">GPS: Acquiring...</span>
        </div>
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-compass text-red-500"></i>
            <span id="heading-status" class="font-mono">Az: 0.0° | Alt: 0.0°</span>
        </div>
        <button onclick="toggleCalibration()" class="bg-red-900 px-2 py-1 rounded border border-red-500 text-white font-bold">Align</button>
    </header>

    <!-- Main Viewport: Camera Feed + HUD Overlay -->
    <main class="relative flex-1 w-full overflow-hidden flex items-center justify-center">
        <!-- Rear Camera Video Stream -->
        <video id="camera-feed" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover filter contrast-125 brightness-75"></video>
        
        <!-- Canvas Layer for Star Detection / Overlay Processing -->
        <canvas id="vision-canvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>

        <!-- Reticle / Push-To Bullseye -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
            <div id="bullseye" class="w-48 h-48 rounded-full border-2 border-dashed border-red-500 flex items-center justify-center transition-colors duration-300">
                <div class="w-2 h-2 bg-red-500 rounded-full"></div>
            </div>
        </div>

        <!-- Directional Guidance Overlays -->
        <div id="guidance-overlay" class="absolute inset-x-0 top-6 flex flex-col items-center pointer-events-none z-10">
            <div id="target-name-display" class="text-sm font-bold bg-black/60 px-3 py-1 rounded-full border border-red-800 mb-2">Target: None Selected</div>
            <div id="arrow-container" class="flex space-x-4 text-2xl font-bold text-red-500">
                <i id="arrow-up" class="fa-solid fa-arrow-up opacity-20"></i>
                <i id="arrow-down" class="fa-solid fa-arrow-down opacity-20"></i>
                <i id="arrow-left" class="fa-solid fa-arrow-left opacity-20"></i>
                <i id="arrow-right" class="fa-solid fa-arrow-right opacity-20"></i>
            </div>
            <div id="angular-distance" class="font-mono text-xs mt-1 bg-black/60 px-2 py-0.5 rounded">Delta: --</div>
        </div>
    </main>

    <!-- Bottom Control Dock -->
    <footer class="w-full bg-red-panel border-t border-red p-3 flex justify-between items-center z-20">
        <button onclick="openCatalog()" class="flex-1 bg-red-950 hover:bg-red-900 border border-red-600 py-3 rounded-lg font-bold text-sm flex items-center justify-center space-x-2">
            <i class="fa-solid fa-binoculars"></i>
            <span>Select Target</span>
        </button>
    </footer>

    <!-- Target Selection Modal -->
    <div id="catalog-modal" class="hidden absolute inset-0 bg-black/95 z-50 flex flex-col p-4">
        <div class="flex justify-between items-center border-b border-red-800 pb-3 mb-3">
            <h2 class="text-lg font-bold">Celestial Catalog</h2>
            <button onclick="closeCatalog()" class="text-xl font-bold px-3 py-1 bg-red-900 rounded">✕</button>
        </div>
        <div id="target-list" class="flex-1 overflow-y-auto space-y-2">
            <!-- Populated Dynamically via JS -->
        </div>
    </div>

    <script>
        // --- Core Application State ---
        let currentHeading = 0, currentPitch = 45, currentRoll = 0;
        let userLat = 37.7749, userLon = -122.4194; // Default fallback location
        let selectedTarget = null;
        
        const catalog = [
            { name: "Andromeda Galaxy (M31)", ra: 0.712, dec: 41.269, type: "Galaxy" },
            { name: "Orion Nebula (M42)", ra: 5.588, dec: -5.391, type: "Nebula" },
            { name: "Pleiades (M45)", ra: 3.79, dec: 24.11, type: "Cluster" },
            { name: "Ring Nebula (M57)", ra: 18.893, dec: 33.029, type: "Nebula" },
            { name: "Jupiter", ra: 4.5, dec: 20.0, type: "Planet" }, // dynamic values calculated in full systems
            { name: "Saturn", ra: 22.4, dec: -10.5, type: "Planet" }
        ];

        // --- Hardware Initialization ---
        async function initHardware() {
            // 1. Camera Initialization (Rear Camera Preferred)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }));
                
                document.getElementById('camera-feed').srcObject = stream;
            } catch (err) {
                console.warn("Rear camera fallback triggered:", err);
            }

            // 2. Geolocation Tracking
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(pos => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    document.getElementById('gps-status').innerText = `GPS: Locked (${userLat.toFixed(1)}°, ${userLon.toFixed(1)}°)`;
                }, err => {
                    document.getElementById('gps-status').innerText = "GPS: Default Loc";
                }, { enableHighAccuracy: true });
            }

            // 3. Sensor Fusion / Orientation Event Listeners
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        // --- Sensor Fusion Pipeline ---
        function handleOrientation(event) {
            // Absolute heading if available (iOS webkitCompassHeading or Android absolute flag)
            if (event.webkitCompassHeading !== undefined) {
                currentHeading = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                currentHeading = event.absolute ? event.alpha : (360 - event.alpha);
            }
            
            currentPitch = event.beta !== null ? event.beta : 0; // Tilt forward/backward
            currentRoll = event.gamma !== null ? event.gamma : 0; // Tilt left/right

            document.getElementById('heading-status').innerText = `Az: ${currentHeading.toFixed(1)}° | Alt: ${currentPitch.toFixed(1)}°`;

            if (selectedTarget) {
                updateGuidanceHUD();
            }
        }

        // --- Push-To Guidance Logic ---
        function updateGuidanceHUD() {
            // Simple mock vector offset calculation relative to selected target
            let targetAz = selectedTarget.ra * 15; // Rough coordinate translation placeholder
            let targetAlt = selectedTarget.dec + 20;

            let diffAz = targetAz - currentHeading;
            let diffAlt = targetAlt - currentPitch;
            let totalDelta = Math.sqrt(diffAz * diffAz + diffAlt * diffAlt);

            document.getElementById('angular-distance').innerText = `Delta: ${totalDelta.toFixed(1)}°`;

            // UI Directional Arrows
            document.getElementById('arrow-up').style.opacity = diffAlt > 2 ? '1' : '0.2';
            document.getElementById('arrow-down').style.opacity = diffAlt < -2 ? '1' : '0.2';
            document.getElementById('arrow-right').style.opacity = diffAz > 2 ? '1' : '0.2';
            document.getElementById('arrow-left').style.opacity = diffAz < -2 ? '1' : '0.2';

            const bullseye = document.getElementById('bullseye');
            if (totalDelta < 2.0) {
                bullseye.classList.remove('border-red-500');
                bullseye.classList.add('border-green-500', 'bg-green-500/10');
            } else {
                bullseye.classList.add('border-red-500');
                bullseye.classList.remove('border-green-500', 'bg-green-500/10');
            }
        }

        // --- Catalog UI Controls ---
        function openCatalog() {
            const list = document.getElementById('target-list');
            list.innerHTML = '';
            catalog.forEach(item => {
                let div = document.createElement('div');
                div.className = "bg-red-950/60 border border-red-800 p-3 rounded flex justify-between items-center cursor-pointer hover:bg-red-900";
                div.innerHTML = `<div><div class="font-bold">${item.name}</div><div class="text-xs text-red-400">${item.type}</div></div><button class="px-3 py-1 bg-red-700 text-xs rounded font-bold">Track</button>`;
                div.onclick = () => selectTarget(item);
                list.appendChild(div);
            });
            document.getElementById('catalog-modal').classList.remove('hidden');
        }

        function closeCatalog() {
            document.getElementById('catalog-modal').classList.add('hidden');
        }

        function selectTarget(item) {
            selectedTarget = item;
            document.getElementById('target-name-display').innerText = `Target: ${item.name}`;
            closeCatalog();
        }

        function toggleCalibration() {
            alert("Align telescope eyepiece with a known bright star and tap OK to lock offset matrix.");
        }

        // Run initialization on load
        window.onload = initHardware;
    </script>
</body>
</html>
